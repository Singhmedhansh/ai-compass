services:
  - type: web
    name: ai-compass
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wsgi:app --config gunicorn.conf.py --bind 0.0.0.0:10000"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://ai-compass.in
      - key: CANONICAL_HOST
        value: ai-compass.in
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-compass-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Read path for the homepage growth panel (app/platform_stats.py).
      # sync: false = "this service requires the var, but its VALUE is managed
      # in the Render dashboard, not here." Declaring them matters: a var that
      # exists only in the dashboard of a blueprint-managed service can be
      # pruned on the next blueprint sync, which is silent — the app just goes
      # back to serving the hand-typed FALLBACK_STATS snapshot.
      #
      # POSTHOG_PERSONAL_API_KEY is a PERSONAL key (phx_...) scoped to
      # "Query: Read", NOT the phc_... public ingest key used by posthog-js.
      # POSTHOG_PROJECT_ID is the numeric id from the project URL.
      - key: POSTHOG_PERSONAL_API_KEY
        sync: false
      - key: POSTHOG_PROJECT_ID
        sync: false
      # Outreach campaign limits, declared WITH values rather than sync: false.
      #
      # These were set in the Render dashboard and nowhere else, so when the
      # code defaults were raised to 90/20 on 2026-09-15 nothing changed: the
      # dashboard's 45 and 10 kept winning, silently, and the campaign sat at
      # zero budget remaining for four days with 57 approved candidates behind
      # it. A limit that decides whether revenue email goes out should not live
      # somewhere that never shows up in a diff or a review.
      #
      # Declaring a value here makes the blueprint authoritative and overwrites
      # the dashboard on sync — which is the point. Change them in this file.
      - key: OUTREACH_CAMPAIGN_SEND_BUDGET
        value: "100"
      - key: OUTREACH_CAMPAIGN_DAILY_MAX
        value: "20"

databases:
  - name: ai-compass-db
    plan: free