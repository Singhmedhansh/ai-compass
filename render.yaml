services:
  - type: web
    name: ai-compass
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wsgi:app --config gunicorn.conf.py --bind 0.0.0.0:10000"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://ai-compass.in
      - key: CANONICAL_HOST
        value: ai-compass.in
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-compass-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: ai-compass-db
    plan: free